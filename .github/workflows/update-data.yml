name: Update Brasileirão Data

on:
  schedule:
    # Daily at 10:00 UTC (07:00 BRT)
    - cron: '0 10 * * *'
  workflow_dispatch: # Allows a manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch ESPN data (matches)
        run: python scripts/fetch_espn.py

      - name: Fetch Transfermarkt data (market)
        run: python scripts/fetch_transfermarkt.py

      - name: Fetch historical data (weekly)
        run: python scripts/fetch_historico.py
        if: github.event.schedule != '' && contains('0', github.run_number)
        continue-on-error: true

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/brasileirao.json data/market-values.json data/historico.json
          git diff --staged --quiet || git commit -m "chore: update data $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs origin main || true
          git push
